name: Sameina uppstreymi í yrda

# Sameinar master sveinbjornt/ensk.is vikulega í grein yrda, svo Yrða fái nýjar uppstreymisbreytingar
# ásamt leiðréttingum sínum. Sameinað er en aldrei endurgrunnað, svo færslur sem Yrða festir haldist.
# Stangist breytingar á fellur keyrslan (GitHub lætur vita) og sameina þarf handvirkt.
# Áætlaðar keyrslur fara aðeins af sjálfgefinni grein, svo yrda verður að vera hún.
#
# Kóði uppstreymis (gen/verify.py) keyrir aðeins í verkinu profa, sem hefur lesaðgang og engan
# lykil. Verkið yta sameinar sömu færslur aftur, ber tréð saman við það sem var prófað og ýtir
# með YRDA_KVISL_LYKILL, því GITHUB_TOKEN má ekki ýta færslum sem breyta .github/workflows/,
# eins og uppstreymisfærslur gera öðru hverju.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uppfaera-yrda
  cancel-in-progress: false

jobs:
  profa:
    runs-on: ubuntu-latest
    outputs:
      yrda: ${{ steps.sameina.outputs.yrda }}
      uppstreymi: ${{ steps.sameina.outputs.uppstreymi }}
      tre: ${{ steps.sameina.outputs.tre }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: yrda
          fetch-depth: 0
          persist-credentials: false

      - name: Sameina uppstreymi
        id: sameina
        run: |
          git remote add uppstreymi https://github.com/sveinbjornt/ensk.is.git
          git fetch --no-tags uppstreymi master
          if git merge-base --is-ancestor uppstreymi/master HEAD; then
            echo "Ekkert nýtt í uppstreymi."
            exit 0
          fi
          echo "yrda=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "uppstreymi=$(git rev-parse uppstreymi/master)" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit -m "Sameinar master úr sveinbjornt/ensk.is" uppstreymi/master; then
            {
              echo "Sameining sveinbjornt/ensk.is master ($(git rev-parse --short uppstreymi/master)) í yrda stangaðist á í:"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo
              echo "Sameinið handvirkt (merge, ekki rebase) og ýtið á yrda."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "tre=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # Yrða les aðeins data/dict, svo hér er aðeins snið gagnanna staðfest. gen/gen.py og pytest
      # prófa vefforrit uppstreymis; build-vinnuflæði uppstreymis keyrir þau eftir ýtingu á yrda.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.sameina.outputs.tre
        with:
          python-version: "3.14"

      - name: Staðfesta gögn
        if: steps.sameina.outputs.tre
        run: |
          echo "orjson==3.13.0 --hash=sha256:58a9619d88f8818d9ab6b39d70d203789457ba13c1ed5d274f33ce9ae7e81a36" > "$RUNNER_TEMP/krofur.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/krofur.txt"
          python gen/verify.py

  yta:
    needs: profa
    if: needs.profa.outputs.tre
    runs-on: ubuntu-latest
    steps:
      - name: Athuga lykil
        env:
          LYKILL: ${{ secrets.YRDA_KVISL_LYKILL }}
        run: |
          if [ -z "$LYKILL" ]; then
            echo "::error title=YRDA_KVISL_LYKILL vantar::Vistið aðgangslykil með Contents og Workflows (Read and write) á Yrda-is/ensk.is sem leyndarmálið YRDA_KVISL_LYKILL (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.profa.outputs.yrda }}
          fetch-depth: 0
          token: ${{ secrets.YRDA_KVISL_LYKILL }}

      - name: Sameina og ýta á yrda
        env:
          UPPSTREYMI: ${{ needs.profa.outputs.uppstreymi }}
          TRE: ${{ needs.profa.outputs.tre }}
        run: |
          git fetch --no-tags https://github.com/sveinbjornt/ensk.is.git "$UPPSTREYMI"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -m "Sameinar master úr sveinbjornt/ensk.is" "$UPPSTREYMI"
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$TRE" ]; then
            echo "::error::Sameiningin gaf annað tré en verkið profa prófaði."
            exit 1
          fi
          git push origin HEAD:yrda
